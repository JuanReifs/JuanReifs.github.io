change_name: init-detector
status: proposed
executive_summary: |
  A 100% frontend SPA game "DAM Impostor Detector".
  Combines Cyberpunk neon aesthetics with Among Us gamification.
  Features 4 selection groups, a 10-question technical quiz, and a suspicion system.
next_recommended: sdd-spec
risks:
  - Complex CSS animations in a single file might be hard to maintain.
  - No persistence between sessions (unless LocalStorage is used).
